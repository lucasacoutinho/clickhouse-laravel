name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer install --no-interaction --prefer-dist --ignore-platform-req=ext-pdo_clickhouse

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  integration:
    name: Integration (ClickHouse)
    runs-on: ubuntu-latest
    needs: unit

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo
          coverage: none

      - name: Build ext-clickhouse
        env:
          GH_TOKEN: ${{ secrets.PDO_GITHUB_TOKEN }}
        run: |
          git clone --recursive https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse.git /tmp/ext-clickhouse
          cd /tmp/ext-clickhouse
          phpize
          ./configure
          make -j$(nproc)
          sudo make install
          echo "extension=clickhouse.so" | sudo tee /etc/php/8.3/cli/conf.d/30-clickhouse.ini

      - name: Build ext-clickhouse-pdo
        env:
          GH_TOKEN: ${{ secrets.PDO_GITHUB_TOKEN }}
        run: |
          git clone https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse-pdo.git /tmp/ext-clickhouse-pdo
          cd /tmp/ext-clickhouse-pdo
          phpize
          ./configure
          make -j$(nproc)
          sudo make install
          echo "extension=pdo_clickhouse.so" | sudo tee /etc/php/8.3/cli/conf.d/31-pdo_clickhouse.ini

      - name: Verify extensions
        run: |
          php -m | grep clickhouse
          php -m | grep pdo_clickhouse

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration tests
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_DATABASE: default
        run: vendor/bin/phpunit --testsuite Integration
