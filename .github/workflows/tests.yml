name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer install --no-interaction --prefer-dist --ignore-platform-req=ext-pdo_clickhouse

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  integration:
    name: Integration (ClickHouse)
    runs-on: ubuntu-latest
    needs: unit

    services:
      clickhouse1:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
          CLICKHOUSE_PASSWORD: ""
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse2:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
          CLICKHOUSE_PASSWORD: ""
        ports:
          - 9001:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo
          coverage: none

      - name: Clone extensions
        env:
          GH_TOKEN: ${{ secrets.PDO_GITHUB_TOKEN }}
        run: |
          git clone --recursive "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse.git" /tmp/build/ext-clickhouse
          git clone "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse-pdo.git" /tmp/build/ext-clickhouse-pdo

      - name: Compute cache key from cloned repos
        id: ext-versions
        run: |
          EXT_SHA=$(git -C /tmp/build/ext-clickhouse rev-parse HEAD)
          PDO_SHA=$(git -C /tmp/build/ext-clickhouse-pdo rev-parse HEAD)
          PHP_VER=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          echo "cache-key=ext-clickhouse-${PHP_VER}-${EXT_SHA}-${PDO_SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache compiled extensions
        id: ext-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ext-compiled
          key: ${{ steps.ext-versions.outputs.cache-key }}

      - name: Build extensions
        if: steps.ext-cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp/build/ext-clickhouse
          phpize && ./configure && make -j$(nproc)

          cd /tmp/build/ext-clickhouse-pdo
          phpize && ./configure --enable-pdo-clickhouse && make -j$(nproc)

          mkdir -p /tmp/ext-compiled
          cp /tmp/build/ext-clickhouse/modules/clickhouse.so /tmp/ext-compiled/
          cp /tmp/build/ext-clickhouse-pdo/modules/pdo_clickhouse.so /tmp/ext-compiled/

      - name: Install extensions
        run: |
          PHP_EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          sudo cp /tmp/ext-compiled/clickhouse.so "${PHP_EXT_DIR}/"
          sudo cp /tmp/ext-compiled/pdo_clickhouse.so "${PHP_EXT_DIR}/"

          PHP_INI_DIR=$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')
          echo "extension=clickhouse.so" | sudo tee "${PHP_INI_DIR}/30-clickhouse.ini"
          echo "extension=pdo_clickhouse.so" | sudo tee "${PHP_INI_DIR}/31-pdo_clickhouse.ini"

      - name: Verify extensions
        run: |
          php -m | grep -i clickhouse
          php -r "echo 'PDO drivers: ' . implode(', ', PDO::getAvailableDrivers()) . PHP_EOL;"

      - name: Wait for ClickHouse ports
        run: |
          for port in 9000 9001; do
            echo "Waiting for port ${port}..."
            for i in $(seq 1 30); do
              if bash -c "echo > /dev/tcp/127.0.0.1/${port}" 2>/dev/null; then
                echo "Port ${port} is ready"
                break
              fi
              sleep 1
            done
          done

      - name: Test ClickHouse connectivity
        shell: bash
        run: |
          php -r '
          echo "=== Native Client ===" . PHP_EOL;
          if (class_exists("ClickHouse\Driver\ClientOptions")) {
              try {
                  $opts = new ClickHouse\Driver\ClientOptions(host: "127.0.0.1", port: 9000);
                  $client = new ClickHouse\Driver\Client($opts);
                  echo "Native: CONNECTED" . PHP_EOL;
              } catch (Throwable $e) {
                  echo "Native: " . get_class($e) . ": " . $e->getMessage() . PHP_EOL;
              }
          } else { echo "ext-clickhouse NOT loaded" . PHP_EOL; }
          echo PHP_EOL . "=== PDO ===" . PHP_EOL;
          foreach ([9000, 9001] as $port) {
              try {
                  $pdo = new PDO("clickhouse:host=127.0.0.1;port={$port};dbname=default", "default", "");
                  $r = $pdo->query("SELECT 1 AS v");
                  echo "Port {$port}: OK (" . $r->fetchColumn() . ")" . PHP_EOL;
              } catch (Throwable $e) {
                  echo "Port {$port}: " . get_class($e) . ": " . $e->getMessage() . PHP_EOL;
              }
          }
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration tests
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_PORT_2: 9001
          CLICKHOUSE_DATABASE: default
        run: vendor/bin/phpunit --testsuite Integration
