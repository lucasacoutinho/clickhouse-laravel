name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer install --no-interaction --prefer-dist --ignore-platform-req=ext-pdo_clickhouse

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  integration:
    name: Integration (ClickHouse)
    runs-on: ubuntu-latest
    needs: unit

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo
          coverage: none

      - name: Clone extensions
        env:
          GH_TOKEN: ${{ secrets.PDO_GITHUB_TOKEN }}
        run: |
          git clone --recursive "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse.git" /tmp/build/ext-clickhouse
          git clone "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse-pdo.git" /tmp/build/ext-clickhouse-pdo

      - name: Build ext-clickhouse
        run: |
          cd /tmp/build/ext-clickhouse
          phpize
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Build ext-clickhouse-pdo
        run: |
          cd /tmp/build/ext-clickhouse-pdo
          phpize
          ./configure --enable-pdo-clickhouse
          make -j$(nproc)
          sudo make install

      - name: Enable extensions
        run: |
          PHP_INI_DIR=$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')
          echo "extension=clickhouse.so" | sudo tee "${PHP_INI_DIR}/30-clickhouse.ini"
          echo "extension=pdo_clickhouse.so" | sudo tee "${PHP_INI_DIR}/31-pdo_clickhouse.ini"

      - name: Verify extensions
        run: |
          php -m | grep -i clickhouse
          php -r "echo 'PDO drivers: ' . implode(', ', PDO::getAvailableDrivers()) . PHP_EOL;"

      - name: Test ClickHouse connectivity
        run: |
          php -r "
            try {
              \$pdo = new PDO('clickhouse:host=127.0.0.1;port=9000;dbname=default', 'default', '');
              \$r = \$pdo->query('SELECT 1 AS v');
              echo 'Connected! Result: ' . \$r->fetchColumn() . PHP_EOL;
            } catch (Throwable \$e) {
              echo 'FAILED: ' . \$e->getMessage() . PHP_EOL;
              exit(1);
            }
          "

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration tests
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_DATABASE: default
        run: vendor/bin/phpunit --testsuite Integration
