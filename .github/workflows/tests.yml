name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer install --no-interaction --prefer-dist --ignore-platform-req=ext-pdo_clickhouse

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  integration:
    name: Integration (ClickHouse)
    runs-on: ubuntu-latest
    needs: unit

    services:
      clickhouse1:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse2:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 9001:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo
          coverage: none

      - name: Get extension versions for cache key
        id: ext-versions
        env:
          GH_TOKEN: ${{ secrets.PDO_GITHUB_TOKEN }}
        run: |
          EXT_SHA=$(git ls-remote "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse.git" HEAD | cut -f1)
          PDO_SHA=$(git ls-remote "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse-pdo.git" HEAD | cut -f1)
          PHP_VER=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          echo "cache-key=ext-clickhouse-${PHP_VER}-${EXT_SHA}-${PDO_SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache compiled extensions
        id: ext-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ext-compiled
          key: ${{ steps.ext-versions.outputs.cache-key }}

      - name: Clone and build extensions
        if: steps.ext-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.PDO_GITHUB_TOKEN }}
        run: |
          git clone --recursive "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse.git" /tmp/build/ext-clickhouse
          git clone "https://${GH_TOKEN}@github.com/lightprofco/ext-clickhouse-pdo.git" /tmp/build/ext-clickhouse-pdo

          cd /tmp/build/ext-clickhouse
          phpize && ./configure && make -j$(nproc)

          cd /tmp/build/ext-clickhouse-pdo
          phpize && ./configure --enable-pdo-clickhouse && make -j$(nproc)

          mkdir -p /tmp/ext-compiled
          cp /tmp/build/ext-clickhouse/modules/clickhouse.so /tmp/ext-compiled/
          cp /tmp/build/ext-clickhouse-pdo/modules/pdo_clickhouse.so /tmp/ext-compiled/

      - name: Install extensions
        run: |
          PHP_EXT_DIR=$(php -r 'echo ini_get("extension_dir");')
          sudo cp /tmp/ext-compiled/clickhouse.so "${PHP_EXT_DIR}/"
          sudo cp /tmp/ext-compiled/pdo_clickhouse.so "${PHP_EXT_DIR}/"

          PHP_INI_DIR=$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')
          echo "extension=clickhouse.so" | sudo tee "${PHP_INI_DIR}/30-clickhouse.ini"
          echo "extension=pdo_clickhouse.so" | sudo tee "${PHP_INI_DIR}/31-pdo_clickhouse.ini"

      - name: Verify extensions
        run: |
          php -m | grep -i clickhouse
          php -r "echo 'PDO drivers: ' . implode(', ', PDO::getAvailableDrivers()) . PHP_EOL;"

      - name: Wait for ClickHouse ports
        run: |
          for port in 9000 9001; do
            echo "Waiting for port ${port}..."
            for i in $(seq 1 30); do
              if bash -c "echo > /dev/tcp/127.0.0.1/${port}" 2>/dev/null; then
                echo "Port ${port} is ready"
                break
              fi
              sleep 1
            done
          done

      - name: Test ClickHouse connectivity
        run: |
          for port in 9000 9001; do
            php -r "
              try {
                \$pdo = new PDO('clickhouse:host=127.0.0.1;port=${port};dbname=default', 'default', '', [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                \$r = \$pdo->query('SELECT 1 AS v');
                echo 'Node ${port}: Connected! Result: ' . \$r->fetchColumn() . PHP_EOL;
              } catch (PDOException \$e) {
                echo 'Node ${port}: FAILED' . PHP_EOL;
                echo '  Message: ' . \$e->getMessage() . PHP_EOL;
                echo '  Code: ' . \$e->getCode() . PHP_EOL;
                echo '  ErrorInfo: ' . json_encode(\$e->errorInfo ?? 'none') . PHP_EOL;
                exit(1);
              }
            "
          done

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration tests
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_PORT_2: 9001
          CLICKHOUSE_DATABASE: default
        run: vendor/bin/phpunit --testsuite Integration
