name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NATIVE_EXTENSION_VERSION: 1.5.0

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: >-
          composer install
          --no-interaction
          --prefer-dist
          --ignore-platform-req=ext-clickhouse
          --ignore-platform-req=ext-pdo_clickhouse

      - name: Check formatting
        run: composer format:check

      - name: Run PHPStan and Psalm
        run: composer analyse

  unit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo
          coverage: none

      - name: Select framework versions
        run: >-
          composer require
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --no-update
          --no-interaction

      - name: Install dependencies
        run: >-
          composer install
          --no-interaction
          --prefer-dist
          --ignore-platform-req=ext-clickhouse
          --ignore-platform-req=ext-pdo_clickhouse

      - name: Run unit tests
        run: composer test:unit

  integration:
    name: ClickHouse ${{ matrix.clickhouse }} / PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest
    needs: [quality, unit]

    strategy:
      fail-fast: false
      matrix:
        clickhouse: ['26.3', '26.6', '26.8']

    services:
      clickhouse1:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
          CLICKHOUSE_PASSWORD: ""
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse2:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
          CLICKHOUSE_PASSWORD: ""
        ports:
          - 9001:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo
          coverage: none

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            g++ \
            libssl-dev \
            make \
            pkg-config

      - name: Clone released extensions
        run: |
          git clone --branch "v${NATIVE_EXTENSION_VERSION}" --depth 1 --recurse-submodules \
            https://github.com/lucasacoutinho/ext-clickhouse.git /tmp/build/ext-clickhouse
          git clone --branch "v${NATIVE_EXTENSION_VERSION}" --depth 1 \
            https://github.com/lucasacoutinho/ext-clickhouse-pdo.git /tmp/build/ext-clickhouse-pdo

      - name: Cache compiled extensions
        id: ext-cache
        uses: actions/cache@v6
        with:
          path: /tmp/ext-compiled
          key: clickhouse-extensions-v${{ env.NATIVE_EXTENSION_VERSION }}-php8.5-${{ runner.os }}-${{ runner.arch }}

      - name: Build released extensions
        if: steps.ext-cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp/build/ext-clickhouse
          phpize
          ./configure
          make -j"$(nproc)"

          cd /tmp/build/ext-clickhouse-pdo
          phpize
          ./configure --enable-pdo-clickhouse
          make -j"$(nproc)"

          mkdir -p /tmp/ext-compiled
          cp /tmp/build/ext-clickhouse/modules/clickhouse.so /tmp/ext-compiled/
          cp /tmp/build/ext-clickhouse-pdo/modules/pdo_clickhouse.so /tmp/ext-compiled/

      - name: Install extensions
        run: |
          php_ext_dir="$(php -r 'echo ini_get("extension_dir");')"
          sudo cp /tmp/ext-compiled/clickhouse.so "${php_ext_dir}/"
          sudo cp /tmp/ext-compiled/pdo_clickhouse.so "${php_ext_dir}/"

          php_ini_dir="$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')"
          echo "extension=clickhouse.so" | sudo tee "${php_ini_dir}/30-clickhouse.ini"
          echo "extension=pdo_clickhouse.so" | sudo tee "${php_ini_dir}/31-pdo_clickhouse.ini"

      - name: Verify extension releases
        run: |
          # shellcheck disable=SC2016
          php -r '
          $expected = getenv("NATIVE_EXTENSION_VERSION");
          foreach (["clickhouse", "pdo_clickhouse"] as $extension) {
              $version = phpversion($extension);
              if ($version !== $expected) {
                  throw new RuntimeException("Expected {$extension} {$expected}, got {$version}");
              }
          }
          if (!in_array("clickhouse", PDO::getAvailableDrivers(), true)) {
              throw new RuntimeException("PDO ClickHouse driver is unavailable");
          }
          '

      - name: Select Laravel 13
        run: >-
          composer require
          "laravel/framework:13.*"
          "orchestra/testbench:11.*"
          --no-update
          --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration tests
        env:
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_PORT_2: 9001
          CLICKHOUSE_DATABASE: default
        run: composer test:integration
