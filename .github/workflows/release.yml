name: Release

# Tag pushes publish a release. workflow_dispatch only republishes an existing
# tag. A release event is intentionally omitted: creating the GitHub release
# would start this workflow again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      version: ${{ steps.preflight.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version, branch, and changelog
        id: preflight
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"

            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must be a stable semantic version such as v1.2.3." >&2
              exit 1
            fi

            RELEASE_VERSION="${tag#v}"

            git fetch --quiet --no-tags origin "${DEFAULT_BRANCH}"
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
              echo "Tagged commit ${GITHUB_SHA} is not on ${DEFAULT_BRANCH}." >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "Releases must run from ${DEFAULT_BRANCH}, not ${GITHUB_REF_NAME}." >&2
              exit 1
            fi

            if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must be a stable semantic version such as 1.2.3." >&2
              exit 1
            fi

            tag="v${RELEASE_VERSION}"

            fetch_err="$(mktemp)"
            if ! git fetch --quiet origin "+refs/tags/${tag}:refs/tags/${tag}" 2>"${fetch_err}"; then
              if grep -q "couldn't find remote ref" "${fetch_err}"; then
                echo "Tag ${tag} does not exist. The bot or cloud agent must push ${tag} (or gh release create) first." >&2
              else
                cat "${fetch_err}" >&2
                echo "Could not fetch ${tag} from origin." >&2
              fi
              rm -f "${fetch_err}"
              exit 1
            fi
            rm -f "${fetch_err}"
          else
            echo "Unsupported event ${GITHUB_EVENT_NAME}." >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "${tag}" 2>/dev/null || true)"

          if [[ -z "${tag_commit}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "Tag ${tag} does not exist. The bot or cloud agent must push ${tag} (or gh release create) first." >&2
            else
              echo "Tag ${tag} was not found in this checkout." >&2
            fi
            exit 1
          fi

          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "${tag} points to ${tag_commit}, not ${GITHUB_SHA}." >&2
            exit 1
          fi

          if ! grep -Fq "## [${RELEASE_VERSION}] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no dated ${RELEASE_VERSION} release section." >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "version=${RELEASE_VERSION}"
          } >> "${GITHUB_OUTPUT}"

  tests:
    name: Complete test matrix
    needs: validate
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    needs: [validate, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMPOSER_ROOT_VERSION: ${{ needs.validate.outputs.version }}
      TAG_NAME: ${{ needs.validate.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: zip
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Build release archive
        run: |
          mkdir -p dist
          composer archive \
            --format=zip \
            --dir=dist \
            --file="clickhouse-laravel-${TAG_NAME}"
          sha256sum "dist/clickhouse-laravel-${TAG_NAME}.zip" \
            > "dist/clickhouse-laravel-${TAG_NAME}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/* \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --verify-tag
          fi

          {
            echo "### Published $TAG_NAME"
            echo
            echo "- GitHub release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME"
            echo "- Packagist: https://packagist.org/packages/lucasacoutinho/clickhouse-laravel"
          } >> "$GITHUB_STEP_SUMMARY"
