services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.6.2.81
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  benchmark:
    image: clickhouse-laravel-benchmark:local
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      BENCHMARK_CLICKHOUSE_HOST: clickhouse
      BENCHMARK_CLICKHOUSE_HTTP_PORT: 8123
      BENCHMARK_CLICKHOUSE_NATIVE_PORT: 9000
      BENCHMARK_DATABASE: default
      NATIVE_SOURCE_REF: ${NATIVE_SOURCE_REF:-working-tree}
    volumes:
      - ${BENCHMARK_RESULTS_DIR}:/results
    profiles: [benchmark]
